name: Windows Portable

on:
  # Ручной запуск из вкладки Actions (кнопка "Run workflow")
  workflow_dispatch:
  # Автосборка релиза при пуше тега вида v1.0.0
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build portable distributable
        run: ./gradlew :desktopApp:createDistributable --no-daemon

      - name: Add diagnostics helpers to app folder
        shell: pwsh
        run: |
          $src = "desktopApp/build/compose/binaries/main/app"
          # Копируем файлы диагностики внутрь папки приложения, чтобы они были рядом с EXE
          # А также в корень, чтобы пользователю было проще их найти
          Copy-Item "desktopApp/packaging/windows/Diagnostics.bat" -Destination "$src/Diagnostics.bat" -Force
          Copy-Item "desktopApp/packaging/windows/КАК-СОБРАТЬ-ЛОГИ.txt" -Destination "$src/КАК-СОБРАТЬ-ЛОГИ.txt" -Force

      - name: Zip portable app
        shell: pwsh
        run: |
          $src = "desktopApp/build/compose/binaries/main/app"
          # Упаковываем содержимое папки app, чтобы в корне архива сразу были нужные файлы
          Compress-Archive -Path "$src/*" -DestinationPath "TariffAnalyzer-Windows-portable.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TariffAnalyzer-Windows-portable
          path: TariffAnalyzer-Windows-portable.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TariffAnalyzer-Windows-portable.zip
